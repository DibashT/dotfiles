bind_to_address     "127.0.0.1"
# Unix socket: rmpc's youtube support (addyt/searchyt) needs this.
# MPD only lets local (socket) clients add local files; TCP clients get
# "Access to local files via TCP is not allowed".
bind_to_address     "~/.config/mpd/socket"
music_directory     "~/Music"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
log_file            "~/.config/mpd/log"
pid_file            "~/.config/mpd/pid"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"

port                "6600"

audio_output {
    type "pulse"
    name "pulse audio"
    # mixer_type "hardware"
    mixer_type "software"
}
audio_output {
    type                    "fifo"
    name                    "my_fifo"
    path                    "/tmp/mpd.fifo"
    format                  "44100:16:2"
}

auto_update "yes"
