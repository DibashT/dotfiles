# sway/config.d/theme.conf — theme customization
#################################################
#                theme customization            #
#################################################

include colors

# Set inner/outer gaps
# gaps inner 5
gaps inner 5
# per-side outer gaps: 5px on left/right/bottom, top stays 0 (waybar occupies the top edge)
gaps top 0
gaps left 5
gaps right 5
gaps bottom 5

# Hide titlebar on windows: 
default_border pixel 2

# disable focus follows mouse
focus_follows_mouse no

# Thin borders:
smart_borders off

# Title format for windows
for_window [shell="xdg_shell"] title_format "%title (%app_id)"
for_window [shell="x_wayland"] title_format "%class - %title"

set $opacity 0.98

for_window [class=".*"] opacity $opacity
for_window [app_id=".*"] opacity $opacity

#----------------#
# set gtk+ theme #
#----------------#
    set $gnome-schema org.gnome.desktop.interface
    exec_always {
        gsettings set $gnome-schema gtk-theme 'Adwaita'
        gsettings set $gnome-schema color-scheme 'prefer-dark'
        gsettings set $gnome-schema cursor-theme 'volantes_cursors'
        #added later
        gsettings set $gnome-schema icon-theme 'Papirus-Dark'
        gsettings set $gnome-schema font-name 'JetBrainsMono Nerd Font 10'
        gsettings set $gnome-schema document-font-name 'JetBrainsMono Nerd Font 11'
        gsettings set $gnome-schema monospace-font-name 'JetBrainsMono Nerd Font Mono 11'
        gsettings set org.gnome.desktop.wm.preferences titlebar-font 'JetBrainsMono Nerd Font Bold 10'
    }

# Window decorations:    border,   background,  text,     indicator, child-border
client.focused           $magenta $base        $text      $magenta  $magenta
client.focused_inactive  $mantle   $base        $text      $mantle    $mantle
client.unfocused         $mantle   $base        $text      $mantle    $mantle
client.urgent            $peach    $base        $peach     $overlay0  $peach
client.placeholder       $base     $base        $text      $overlay0  $overlay0
client.background        $base
