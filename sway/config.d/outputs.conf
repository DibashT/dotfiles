# sway/config.d/outputs.conf — output configuration
#################################################
#                Output configuration           #
#################################################

### Output configuration
# eDP-1 = your laptop screen. Native mode, left side (no forced resolution
# so this keeps working on other panels).
output eDP-1 position 0 0

# DP-1 / HDMI-1 = plug for big monitor. No fixed size here:
# it uses its own best size and sits right of the laptop.
# If nothing is plugged, these lines do nothing. Safe.
output DP-1 position 1366 0
output HDMI-1 position 1366 0
#
# You can get the names of your outputs by running: swaymsg -t get_outputs
