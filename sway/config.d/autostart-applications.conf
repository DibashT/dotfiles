# sway/config.d/autostart-applications.conf — autostart apps
#################################################
#               auto start apps                 #
#################################################

# enable clipboard manager (guarded so reload restarts it if dead, no duplicate if alive)
exec_always sh -c 'pgrep -x wl-paste >/dev/null || exec wl-paste --watch cliphist store'

# enable auto tiling
# exec_always autotiling -l 2

# Needed for D-Bus services: fixes Thunar mounting, screensharing, and portals
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

