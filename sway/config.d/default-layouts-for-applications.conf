# sway/config.d/default-layouts-for-applications.conf — floating / inhibit_idle rules
#################################################
#                   FLOATING                    #
#################################################

# set floating (nontiling)for apps needing it:
for_window [class="Yad" instance="yad"] floating enable
for_window [app_id="yad"] floating enable
for_window [app_id="blueman-manager"] floating enable,  resize set width 40 ppt height 40 ppt
for_window [app_id="file-roller"] floating enable, resize set width 60 ppt height 60 ppt

# set floating (nontiling) for special apps:
for_window [class="Xsane" instance="xsane"] floating enable
# for_window [app_id="pavucontrol"] floating enable, resize set width 30 ppt height 40 ppt
for_window [app_id="pavucontrol"] floating enable, resize set width 45 ppt height 60 ppt
for_window [class="qt5ct" instance="qt5ct"] floating enable, resize set width 60 ppt height 50 ppt
for_window [class="Bluetooth-sendto" instance="bluetooth-sendto"] floating enable
for_window [app_id="pamac-manager"] floating enable, resize set width 80 ppt height 70 ppt
for_window [class="Lxappearance"] floating enable, resize set width 60 ppt height 50 ppt

# Float system password/authentication prompts (native + XWayland)
for_window [app_id="(?i)(polkit-gnome-authentication-agent-1|lxqt-policykit-agent)"] floating enable, move position center
for_window [class="(?i)(polkit-gnome-authentication-agent-1|lxqt-policykit-agent)"] floating enable, move position center

# Catch all standard file picker and save dialogs
for_window [title="(?i)(Open|Save) (File|Folder|As)"] floating enable, resize set width 60 ppt height 60 ppt, move position center

# set floating for window roles
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable
for_window [window_role="About"] floating enable
# for_window [title="File Operation Progress"] floating enable, border pixel 1, sticky enable, resize set width 40 ppt height 30 ppt
for_window [title="File Operation Progress"] floating enable, border pixel 1, sticky enable, resize set width 35 ppt height 25 ppt
for_window [app_id="firedragon" title="Library"] floating enable, border pixel 1, sticky enable, resize set width 55 ppt height 65 ppt
for_window [app_id="floating_shell_portrait"] floating enable, border pixel 1, sticky enable, resize set width 30 ppt height 40 ppt
for_window [title="nmtui"] floating enable,  resize set width 50 ppt height 70 ppt
for_window [title="htop"] floating enable, resize set width 50 ppt height 70 ppt
for_window [app_id="xsensors"] floating enable, resize set width 60 ppt height 60 ppt
for_window [app_id="firedragon" title="firedragon — Sharing Indicator"] floating enable, sticky enable, move position center
for_window [title="Floating Window - Show Me The Key"] floating enable, sticky enable
# for_window [title="Picture in picture"] floating enable, sticky enable, resize set width 350 px height 197 px
# PiP follows the generic centering rule below (no pixel-pinned corner, so it
# works on any output size).
for_window [title="Picture in picture"] floating enable, sticky enable, resize set width 350 px height 197 px

# Inhibit idle
for_window [app_id="firedragon"] inhibit_idle fullscreen
for_window [app_id="Chromium"] inhibit_idle fullscreen
for_window [app_id="brave-browser"] inhibit_idle fullscreen
for_window [app_id="Brave-browser"] inhibit_idle fullscreen
for_window [class="Brave-browser"] inhibit_idle fullscreen
for_window [app_id="mpv"] inhibit_idle visible
for_window [title="Picture in picture"] inhibit_idle visible

# Automatically center all floating windows (must be after float rules)
for_window [floating] move position center
